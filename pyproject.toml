[project]
name = "freecad-ai"
version = "0.1.0"
description = "MCP server that drives FreeCAD 1.1 over an XML-RPC bridge"
readme = "README.md"
authors = [
    { name = "josheeg", email = "josheeg@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.2.0",
]

[project.scripts]
freecad-ai = "freecad_ai:main"

[tool.uv.build-backend]
# The sdist is what someone installs from to build the frozen executable, and
# the wheel is not. Without the spec here, an sdist user has no way to produce
# the .exe at all - found by scripts/release.py, which asserts the archives
# rather than trusting the source tree.
source-include = [
    "packaging/*.spec",
    "CHANGELOG.md",
    "justfile",
    "scripts/verify_freeze.py",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    # Parses .github/workflows/ci.yaml in test_packaging, so the workflow is
    # checked as the structure it is rather than by matching its text. A
    # grep-based check passes on a job that has been renamed or commented out.
    "pyyaml>=6.0",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.9",
]

# Vendored tool trees: upstream code we do not own. Excluded from lint and
# test collection so tooling reports on this project's code only.
[tool.ruff]
line-length = 88
src = ["src", "tests"]
# _freecad_bridge.py runs under FreeCAD's bundled Python 3.11, but ruff infers
# the target version from requires-python (3.14) and takes one value for the
# whole run. Under 3.14 `except A, B:` is valid (PEP 758), so the formatter
# rewrites the parenthesised form to the unparenthesised one — which 3.11 then
# refuses to parse and the bridge stops starting. Excluded here, and formatted
# separately with `ruff format --target-version py311`.
extend-exclude = [
    "src/freecad_ai/_freecad_bridge.py",
    "_bmad",
    "_bmad-output",
    ".agents",
    ".claude",
    ".continue",
    ".goose",
    ".kilo",
    ".opencode",
    ".openhands",
    ".roo",
    ".specify",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
files = ["src", "scripts"]
strict = true
# _freecad_bridge.py runs under FreeCAD's bundled Python 3.11, never under this
# project's 3.14, so strict 3.14 checking does not describe it. It is launched
# by path rather than imported, and ruff still lints it.
exclude = ['^src/freecad_ai/_freecad_bridge\.py$']
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# A timeout is not optional here: integration tests drive a real external
# FreeCAD process, and a wedged one presents as a silent hang, not a failure.
addopts = "-ra --strict-markers --strict-config --timeout=120 --timeout-method=thread"
markers = [
    "integration: requires a live freecadcmd process",
]
